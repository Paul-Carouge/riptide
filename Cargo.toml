[package]
name = "riptide"
version = "0.2.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
gpui = "0.2.2"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
smol = "2.0.2"
thiserror = "2.0.21"
ureq = "3.5.2"

[patch.crates-io]
# shortcut: xattr 0.2.3 (via gpui 0.2.2) breaks on recent libc; drop when gpui updates its deps.
xattr = { path = "vendor/xattr" }

[profile.release]
# Smaller, faster binary: whole-crate-graph inlining across crates and no symbol table.
lto = "thin"
codegen-units = 1
strip = true

[features]
# Keeps the debug-only test hooks (RIPTIDE_DEMO scenes, RIPTIDE_LINK, RIPTIDE_AUTOSTART) in a
# release build, to profile with real optimizations: `cargo build --release --features test-hooks`.
test-hooks = []
